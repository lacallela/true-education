<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="shieldGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a0d12" />
      <stop offset="60%" stop-color="#140608" />
      <stop offset="100%" stop-color="#070304" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="100%" stop-color="#8a0010" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Rivets -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="172" fill="#0d0e14" stroke="#e50914" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Shield Body -->
  <path d="M 200 45 Q 310 55 320 145 Q 320 260 200 355 Q 80 260 80 145 Q 90 55 200 45 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Inner Crimson Chevron / Crest -->
  <path d="M 200 70 Q 285 80 295 150 Q 295 240 200 325 Q 105 240 105 150 Q 115 80 200 70 Z" 
        fill="none" stroke="url(#redGrad)" stroke-width="2.5" />

  <!-- Laurel Wreath Leaves (Left) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 120 170 C 105 190 105 210 120 230 C 130 215 130 185 120 170 Z" />
    <path d="M 130 225 C 120 245 125 265 145 280 C 150 260 145 240 130 225 Z" />
    <path d="M 155 275 C 150 290 165 310 185 318 C 185 300 175 285 155 275 Z" />
  </g>

  <!-- Laurel Wreath Leaves (Right) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 280 170 C 295 190 295 210 280 230 C 270 215 270 185 280 170 Z" />
    <path d="M 270 225 C 280 245 275 265 255 280 C 250 260 255 240 270 225 Z" />
    <path d="M 245 275 C 250 290 235 310 215 318 C 215 300 225 285 245 275 Z" />
  </g>

  <!-- Crossed Batons / Canes (Tactical Weapon of Na Hwa-jin) -->
  <g stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round">
    <line x1="140" y1="110" x2="260" y2="280" />
    <line x1="260" y1="110" x2="140" y2="280" />
  </g>
  <circle cx="140" cy="110" r="8" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="260" cy="110" r="8" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Scales of Justice -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Beam -->
    <line x1="150" y1="165" x2="250" y2="165" />
    <!-- Center Pillar -->
    <line x1="200" y1="140" x2="200" y2="250" stroke-width="5"/>
    <circle cx="200" cy="140" r="6" fill="url(#goldGrad)"/>
    <!-- Left Scale -->
    <line x1="150" y1="165" x2="135" y2="200" />
    <line x1="150" y1="165" x2="165" y2="200" />
    <path d="M 125 200 Q 150 215 175 200 Z" fill="url(#goldGrad)" opacity="0.6"/>
    <!-- Right Scale -->
    <line x1="250" y1="165" x2="235" y2="200" />
    <line x1="250" y1="165" x2="265" y2="200" />
    <path d="M 225 200 Q 250 215 275 200 Z" fill="url(#goldGrad)" opacity="0.6"/>
  </g>

  <!-- Center Star -->
  <polygon points="200,90 205,108 223,108 208,118 214,136 200,125 186,136 192,118 177,108 195,108" 
           fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Korean Text: 참교육 (Chamgyoyuk - True Education) -->
  <text x="200" y="270" text-anchor="middle" font-family="'Pretendard', 'Malgun Gothic', 'Arial Black', sans-serif" 
        font-size="24" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#glow)">참 교 육</text>

  <!-- Subtitle Text: ERPB (Educational Rights Protection Bureau) -->
  <text x="200" y="295" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" 
        font-size="12" font-weight="800" fill="url(#goldGrad)" letter-spacing="3">E.R.P.B</text>

  <!-- Latin Motto -->
  <path id="curve" d="M 110,130 A 130,130 0 0,1 290,130" fill="none"/>
  <text font-size="10" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      LEX ET DISCIPLINA • TEACH YOU A LESSON
    </textPath>
  </text>
</svg>
